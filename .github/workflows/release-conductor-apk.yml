name: Build & Attach Conductor APK to GitHub Release

on:
  release:
    types: [published]

jobs:
  build-conductor-apk:
    if: startsWith(github.ref, 'refs/tags/conductor-')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: byahero-conductor/package-lock.json

      - name: Setup Java JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Install Conductor Dependencies
        run: |
          cd byahero-conductor
          npm ci --legacy-peer-deps || npm install

      - name: Build Android APK
        run: |
          cd byahero-conductor/android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: byahero-conductor/android/app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
