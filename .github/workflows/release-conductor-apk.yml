name: Build & Attach Conductor APK to GitHub Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-conductor-apk:
    if: startsWith(github.ref, 'refs/tags/conductor-')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: byahero-conductor/package-lock.json

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Validate release JSON files
        run: |
          cd byahero-conductor
          node -e "JSON.parse(require('fs').readFileSync('app.json', 'utf8')); console.log('app.json is valid')"
          node -e "JSON.parse(require('fs').readFileSync('package.json', 'utf8')); console.log('package.json is valid')"

      - name: Install Conductor Dependencies
        run: |
          cd byahero-conductor
          npm ci --legacy-peer-deps || npm install

      - name: Inject Version from Tag
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          if [[ "$TAG_NAME" != conductor-* ]]; then
            echo "Unexpected tag: $TAG_NAME"
            exit 1
          fi
          
          VERSION="${TAG_NAME#conductor-v}"
          VERSION="${VERSION#conductor-}"
          echo "Injecting version: $VERSION"
          
          cd byahero-conductor
          export VERSION
          node <<'NODE'
          const fs = require('fs');

          const version = process.env.VERSION;
          if (!version) {
            throw new Error('VERSION is not set');
          }

          const appJson = JSON.parse(fs.readFileSync('app.json', 'utf8'));
          appJson.expo.version = version;
          fs.writeFileSync('app.json', JSON.stringify(appJson, null, 2));
          
          const pkgJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkgJson.version = version;
          fs.writeFileSync('package.json', JSON.stringify(pkgJson, null, 2));
          NODE

      - name: Verify Expo Bundling
        run: |
          cd byahero-conductor
          npx expo export --platform android --output-dir /tmp/expo-export-check

      - name: Verify no hardcoded Java Home in gradle.properties
        run: |
          if grep -q "org.gradle.java.home" byahero-conductor/android/gradle.properties; then
            echo "Error: Hardcoded org.gradle.java.home found in gradle.properties. This will break CI builds."
            exit 1
          fi

      - name: Build Android APK
        run: |
          cd byahero-conductor/android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Rename APK
        run: |
          mv byahero-conductor/android/app/build/outputs/apk/release/app-release.apk byahero-conductor/android/app/build/outputs/apk/release/byahero-conductor.apk

      - name: Upload APK to GitHub Release
        id: upload-release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          files: byahero-conductor/android/app/build/outputs/apk/release/byahero-conductor.apk
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Retry Upload via GitHub CLI (Fallback)
        if: steps.upload-release.outcome != 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          APK_PATH="byahero-conductor/android/app/build/outputs/apk/release/byahero-conductor.apk"
          echo "action-gh-release encountered an issue. Falling back to native gh CLI with retries..."
          echo "Target tag: $TAG_NAME"
          echo "Target file: $APK_PATH"
          
          for attempt in 1 2 3; do
            echo "--> Upload attempt $attempt of 3..."
            if gh release upload "$TAG_NAME" "$APK_PATH" --clobber; then
              echo "APK uploaded successfully via gh CLI!"
              exit 0
            fi
            echo "Attempt $attempt failed. Retrying in 5 seconds..."
            sleep 5
          done
          
          echo "Failed to upload APK to release $TAG_NAME after 3 attempts."
          exit 1
