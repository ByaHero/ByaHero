name: Build & Attach Admin APK to GitHub Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-admin-apk:
    if: startsWith(github.ref, 'refs/tags/admin-')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: byahero-admin/package-lock.json

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Install Admin Dependencies
        run: |
          cd byahero-admin
          npm ci --legacy-peer-deps || npm install

      - name: Inject Version from Tag
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          VERSION=${TAG_NAME#admin-v}
          VERSION=${VERSION#admin-}
          echo "Injecting version: $VERSION"
          
          cd byahero-admin
          node -e "
            const fs = require('fs');
            const appJson = JSON.parse(fs.readFileSync('app.json'));
            appJson.expo.version = '$VERSION';
            fs.writeFileSync('app.json', JSON.stringify(appJson, null, 2));
            
            const pkgJson = JSON.parse(fs.readFileSync('package.json'));
            pkgJson.version = '$VERSION';
            fs.writeFileSync('package.json', JSON.stringify(pkgJson, null, 2));
          "

      - name: Verify Expo Bundling
        run: |
          cd byahero-admin
          npx expo export --platform android --output-dir /tmp/expo-export-check

      - name: Build Android APK
        run: |
          cd byahero-admin/android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Rename APK
        run: |
          mv byahero-admin/android/app/build/outputs/apk/release/app-release.apk byahero-admin/android/app/build/outputs/apk/release/byahero-admin.apk

      - name: Upload APK to GitHub Release
        id: upload-release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          files: byahero-admin/android/app/build/outputs/apk/release/byahero-admin.apk
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Retry Upload via GitHub CLI (Fallback)
        if: steps.upload-release.outcome != 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          APK_PATH="byahero-admin/android/app/build/outputs/apk/release/byahero-admin.apk"
          echo "action-gh-release encountered an issue. Falling back to native gh CLI with retries..."
          echo "Target tag: $TAG_NAME"
          echo "Target file: $APK_PATH"
          
          for attempt in 1 2 3; do
            echo "--> Upload attempt $attempt of 3..."
            if gh release upload "$TAG_NAME" "$APK_PATH" --clobber; then
              echo "APK uploaded successfully via gh CLI!"
              exit 0
            fi
            echo "Attempt $attempt failed. Retrying in 5 seconds..."
            sleep 5
          done
          
          echo "Failed to upload APK to release $TAG_NAME after 3 attempts."
          exit 1
